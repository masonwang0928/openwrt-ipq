name: Build RE-CS-07 最简（用仓库自带.config）
on:
  workflow_dispatch:
  push:
    branches:
      - main-nss

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 换 apt 阿里云源
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo apt update -y

      - name: 安装编译依赖
        run: |
          sudo apt install -y build-essential ccache libelf-dev libssl-dev \
          gawk git python3 python3-distutils python3-setuptools \
          dwarves pahole llvm clang unzip wget zlib1g-dev

      - name: Git 代理加速
        run: |
          git config --global url."https://ghproxy.net/https://github.com/".insteadOf "https://github.com/"
          git config --global url."https://ghproxy.net/https://github.com/".insteadOf "git@github.com:"
          git config --global http.postBuffer 1024M

      - name: 检出代码（带你的 .config）
        uses: actions/checkout@v4
        with:
          repository: masonwang0928/openwrt-ipq
          ref: main-nss
          fetch-depth: 0
          submodules: recursive

      - name: 替换 feeds 国内源
        run: |
          sed -i 's|git://git.openwrt.org|https://ghproxy.net/https://github.com/openwrt|g' feeds.conf.default
          sed -i 's|https://git.openwrt.org|https://ghproxy.net/https://github.com/openwrt|g' feeds.conf.default

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 确认使用你的 .config（只做依赖校验）
        run: |
          ls -la .config
          make defconfig
          cat .config

      - name: 编译（自动多核）
        run: |
          make -j$(nproc)

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ipq60xx/*
