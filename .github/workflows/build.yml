# ------------------------------------------------------
# 京东云 RE-CS-07 终极编译脚本
# 内核：6.6 + NSS/ECM 硬件加速
# 组件：MWAN3 + mwan3help + dae + AdGuardHome + MosDNS + OpenClash + KMS
# 主题：Argon / Bootstrap / Material / OpenWrt2020 / Alpha
# 默认IP：192.168.31.1
# 机型锁定：升级不报错
# ------------------------------------------------------
name: Build RE-CS-07 终极固件

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main-nss
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential ccache libelf-dev libssl-dev \
          gawk git python3 python3-distutils python3-setuptools \
          dwarves pahole llvm clang unzip wget zlib1g-dev

      - name: 创建默认IP脚本(192.168.31.1)
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-set-lan-ip << 'EOF'
#!/bin/sh
uci set network.lan.ipaddr='192.168.31.1'
uci set network.lan.netmask='255.255.255.0'
uci commit network
/etc/init.d/network restart
exit 0
EOF
          chmod 755 files/etc/uci-defaults/99-set-lan-ip

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入完整.config
        run: |
          cat > .config << 'EOF'
# ==============================
# 机型锁定：升级永不报错
# ==============================
CONFIG_TARGET_BOARD="qualcommax"
CONFIG_TARGET_DEVICE_STRING="qualcommax ipq60xx jdcloud_re-cs-07"

# ==============================
# 设备：京东云 RE-CS-07
# ==============================
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y

# ==============================
# 内核 6.6 + NSS/ECM 加速
# ==============================
CONFIG_LINUX_6_6=y
CONFIG_PACKAGE_kmod-qca-nss-drv=y
CONFIG_PACKAGE_kmod-qca-nss-ecm=y
CONFIG_PACKAGE_kmod-qca-nss-ifb=y
CONFIG_PACKAGE_kmod-qca-nss-qdisc=y

# ==============================
# BTF + BPF (dae 必备)
# ==============================
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_BTF=y
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_NET_INGRESS=y
CONFIG_NET_EGRESS=y

# ==============================
# MWAN3 + mwan3help
# ==============================
CONFIG_PACKAGE_mwan3=y
CONFIG_PACKAGE_luci-app-mwan3=y
CONFIG_PACKAGE_mwan3help=y
CONFIG_PACKAGE_luci-app-mwan3help=y

# ==============================
# dae + daed
# ==============================
CONFIG_PACKAGE_dae=y
CONFIG_PACKAGE_daed=y
CONFIG_PACKAGE_luci-app-daed=y
CONFIG_PACKAGE_v2ray-geodata=y

# ==============================
# AdGuardHome
# ==============================
CONFIG_PACKAGE_adguardhome=y
CONFIG_PACKAGE_luci-app-adguardhome=y
CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y

# ==============================
# MosDNS
# ==============================
CONFIG_PACKAGE_mosdns=y
CONFIG_PACKAGE_luci-app-mosdns=y
CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y

# ==============================
# OpenClash
# ==============================
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y

# ==============================
# KMS
# ==============================
CONFIG_PACKAGE_vlmcsd=y
CONFIG_PACKAGE_luci-app-vlmcsd=y

# ==============================
# 全套主题
# ==============================
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_luci-i18n-bootstrap-zh-cn=y
CONFIG_PACKAGE_luci-theme-material=y
CONFIG_PACKAGE_luci-i18n-material-zh-cn=y
CONFIG_PACKAGE_luci-theme-openwrt-2020=y
CONFIG_PACKAGE_luci-i18n-openwrt-2020-zh-cn=y
CONFIG_PACKAGE_luci-theme-alpha=y
CONFIG_PACKAGE_luci-i18n-alpha-zh-cn=y

# ==============================
# 基础工具
# ==============================
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_ip-full=y
CONFIG_PACKAGE_iproute2=y
CONFIG_PACKAGE_ddns-scripts=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget-ssl=y
CONFIG_PACKAGE_block-mount=y
EOF
          make defconfig

      - name: 开始编译
        run: |
          make -j$(nproc) V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: RE-CS07-Full-Firmware
          path: bin/targets/qualcommax/ipq60xx/*.bin
