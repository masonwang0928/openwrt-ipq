name: Build OpenWrt (IPQ60xx NSS)

# ---------- 关键：只留手动触发，GitHub 100% 识别 ----------
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git-core \
            libssl-dev libtool pkg-config libncurses5-dev zlib1g-dev \
            python3 python3-pip unzip wget curl rsync subversion
          sudo -E apt clean

      - name: 下载 OpenWrt 源码（替换成你的仓库/分支）
        run: |
          git clone https://github.com/qosmio/openwrt-ipq.git -b main-nss openwrt
          cd openwrt
          git checkout main-nss

      - name: 更新 & 安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 上传你的 .config（重要！）
        run: |
          cd openwrt
          # 把你仓库根目录的 .config 复制进来
          cp $GITHUB_WORKSPACE/.config .config
          make defconfig

      - name: 下载 dl 包
        run: |
          cd openwrt
          make download -j8

      - name: 编译（大约 2–4 小时）
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 打包固件
        run: |
          cd openwrt
          mkdir -p ../firmware
          find bin/targets/ -name "*sysupgrade*.bin" -o -name "*combined*.img" | xargs -i cp {} ../firmware/

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: firmware/
