name: Build OpenWrt (IPQ60xx NSS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git-core libssl-dev libtool pkg-config libncurses5-dev zlib1g-dev python3 python3-pip unzip wget curl rsync subversion
          sudo -E apt clean

      - name: 下载 OpenWrt 源码
        run: |
          git clone https://github.com/qosmio/openwrt-ipq.git -b main-nss openwrt
          cd openwrt
          git checkout main-nss

      # ==============================
      # 编译缓存（加速后续编译）
      # ==============================
      - name: Cache OpenWrt 编译环境
        uses: actions/cache@v3
        id: cache-openwrt
        with:
          path: |
            openwrt/.ccache
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/dl
            openwrt/package/feeds
          key: ${{ runner.os }}-openwrt-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: 更新 feeds 并安装软件包
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用 .config 配置
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.config .config
          make defconfig

      # ==============================
      # 缓存命中 → 跳过重复下载
      # ==============================
      - name: 下载依赖包 (首次编译执行)
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd openwrt
          make download -j8

      - name: 开始编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      # ==============================
      # 提取固件：升级版 + Uboot直刷版
      # ==============================
      - name: 提取固件
        run: |
          cd openwrt
          mkdir -p ../firmware
          find bin/targets/ -name "*sysupgrade*.bin" -exec cp {} ../firmware/ \;
          find bin/targets/ -name "*factory*.bin" -exec cp {} ../firmware/ \;
          find bin/targets/ -name "u-boot*.bin" -o -name "u-boot*.mbn" -exec cp {} ../firmware/ \; 2>/dev/null || true

      # ==============================
      # 上传到 Actions 临时存储
      # ==============================
      - name: Upload firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: firmware/

      # ==============================
      # 自动上传到 Release（永久保存）
      # ==============================
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/*
          tag_name: "build-${{ github.run_number }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
