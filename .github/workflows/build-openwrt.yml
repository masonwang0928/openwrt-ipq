name: Build OpenWrt (IPQ60xx NSS 复刻版)
concurrency:
  group: openwrt-ipq60xx-build
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v4

      - name: 安装编译依赖环境
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git-core libssl-dev libtool pkg-config libncurses5-dev zlib1g-dev python3 python3-pip unzip wget curl rsync subversion
          sudo -E apt clean

      - name: 拉取 IPQ60xx NSS 源码
        run: |
          git clone https://github.com/qosmio/openwrt-ipq.git -b main-nss openwrt
          cd openwrt
          git checkout main-nss

      - name: 加载编译缓存
        uses: actions/cache@v3
        id: cache-openwrt
        with:
          path: |
            openwrt/.ccache
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/dl
            openwrt/package/feeds
          key: ${{ runner.os }}-openwrt-ipq60xx-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-ipq60xx-

      - name: 更新并安装软件源 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用自定义 .config 配置
        run: |
          cd openwrt
          # 1. 强制复制根目录的.config
          cp -f $GITHUB_WORKSPACE/.config .config
          # 2. 先执行一次defconfig展开依赖
          make defconfig
          # 3. 强制写入设备配置，防止被覆盖
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_cs7=y" >> .config
          # 4. 再次执行defconfig确认
          make defconfig
          # 5. 校验配置是否生效，不生效则直接报错
          grep -q "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_cs7=y" .config || exit 1

      - name: 下载源码依赖包（仅无缓存时执行）
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd openwrt
          make download -j8

      - name: 正式编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 打包 sysupgrade + factory 固件
        run: |
          cd openwrt
          mkdir -p ../firmware
          find bin/targets/ -name "*sysupgrade*.bin" -exec cp {} ../firmware/ \;
          find bin/targets/ -name "*factory*.bin" -exec cp {} ../firmware/ \;
          find bin/targets/ -name "u-boot*.bin" -o -name "u-boot*.mbn" -exec cp {} ../firmware/ \; 2>/dev/null || true

      - name: 上传固件至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipq60xx-firmware
          path: firmware/
