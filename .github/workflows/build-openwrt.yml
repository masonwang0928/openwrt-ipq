name: Build OpenWrt (IPQ60xx NSS 一键通版)
concurrency:
  group: openwrt-ipq60xx-build
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v4

      - name: 安装编译依赖环境
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git-core libssl-dev libtool pkg-config libncurses5-dev zlib1g-dev python3 python3-pip unzip wget curl rsync subversion
          sudo -E apt clean

      - name: 拉取 IPQ60xx NSS 源码
        run: |
          git clone https://github.com/qosmio/openwrt-ipq.git -b main-nss openwrt
          cd openwrt
          git checkout main-nss

      - name: 跳过所有 feeds，直接生成配置（关键）
        run: |
          cd openwrt
          # 1. 直接写入完整的 .config，完全跳过 make defconfig
          cat > .config << 'EOF'
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_cs7=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y
CONFIG_TARGET_ROOTFS_PARTSIZE=256
CONFIG_PACKAGE_kmod-qca-nss-drv=y
CONFIG_PACKAGE_kmod-qca-nss-ecm=y
CONFIG_PACKAGE_nss-firmware-ipq6018=y
CONFIG_PACKAGE_mwan3=y
CONFIG_PACKAGE_luci-app-mwan3=y
CONFIG_PACKAGE_luci-app-mosdns=y
CONFIG_PACKAGE_mosdns=y
CONFIG_PACKAGE_dnsmasq-full=y
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_openclash=y
CONFIG_PACKAGE_luci-app-nikki=y
CONFIG_PACKAGE_nikki=y
CONFIG_PACKAGE_iptables-mod-tproxy=y
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-app-samba4=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_luci-app-upnp=y
# 禁用无线
# CONFIG_PACKAGE_luci-app-wireless is not set
# CONFIG_PACKAGE_kmod-ath11k is not set
# 禁用循环依赖包
# CONFIG_PACKAGE_sqm-scripts is not set
# CONFIG_PACKAGE_sqm-scripts-nss is not set
# CONFIG_PACKAGE_iptasn is not set
# CONFIG_PACKAGE_iptables-nft is not set
# CONFIG_PACKAGE_kmod-tls is not set
EOF
          # 2. 校验配置文件是否生成
          if [ ! -f .config ]; then
            echo ".config 生成失败！"
            exit 1
          fi
          # 3. 校验设备配置是否正确
          grep -q "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_cs7=y" .config || exit 1

      - name: 下载源码依赖包（强制跳过 menuconfig）
        run: |
          cd openwrt
          # 伪造终端环境，跳过 menuconfig
          export TERM=xterm
          # 直接执行 make download，不触发 menuconfig
          make download -j8

      - name: 正式编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 打包固件
        run: |
          cd openwrt
          mkdir -p ../firmware
          find bin/targets/ -name "*sysupgrade*.bin" -exec cp {} ../firmware/ \;
          find bin/targets/ -name "*factory*.bin" -exec cp {} ../firmware/ \;

      - name: 上传固件至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipq60xx-firmware
          path: firmware/
