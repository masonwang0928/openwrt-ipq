name: Build OpenWrt (IPQ60xx NSS 终极稳定版)
concurrency:
  group: openwrt-ipq60xx-build
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v4

      - name: 安装编译依赖环境
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git-core libssl-dev libtool pkg-config libncurses5-dev zlib1g-dev python3 python3-pip unzip wget curl rsync subversion
          sudo -E apt clean

      - name: 拉取 IPQ60xx NSS 源码
        run: |
          git clone https://github.com/qosmio/openwrt-ipq.git -b main-nss openwrt
          cd openwrt
          git checkout main-nss

      # -------------------------- 关键改动：直接写入完整的 .config，跳过所有 make defconfig --------------------------
      - name: 直接写入完整配置（跳过所有自动配置）
        run: |
          cd openwrt
          # 清空旧配置
          rm -f .config
          
          # 写入目标设备配置
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_cs7=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=256" >> .config
          
          # 写入NSS硬件加速
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-ecm=y" >> .config
          echo "CONFIG_PACKAGE_nss-firmware-ipq6018=y" >> .config
          
          # 写入MWAN3
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          
          # 写入MosDNS
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_mosdns=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          
          # 写入代理套件
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-nikki=y" >> .config
          echo "CONFIG_PACKAGE_nikki=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          
          # 写入常用工具
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          
          # 禁用无线相关包
          echo "# CONFIG_PACKAGE_luci-app-wireless is not set" >> .config
          echo "# CONFIG_PACKAGE_kmod-ath11k is not set" >> .config
          
          # 禁用所有可能导致警告的包
          echo "# CONFIG_PACKAGE_sqm-scripts is not set" >> .config
          echo "# CONFIG_PACKAGE_sqm-scripts-nss is not set" >> .config
          echo "# CONFIG_PACKAGE_iptasn is not set" >> .config
          echo "# CONFIG_PACKAGE_iptables-nft is not set" >> .config
          echo "# CONFIG_PACKAGE_kmod-tls is not set" >> .config
          
          # 校验配置是否生成
          if [ ! -f .config ]; then
            echo ".config file not generated!"
            exit 1
          fi
          
          # 校验设备配置是否生效
          grep -q "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_cs7=y" .config || exit 1

      - name: 下载源码依赖包
        run: |
          cd openwrt
          make download -j8

      - name: 正式编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 打包固件
        run: |
          cd openwrt
          mkdir -p ../firmware
          find bin/targets/ -name "*sysupgrade*.bin" -exec cp {} ../firmware/ \;
          find bin/targets/ -name "*factory*.bin" -exec cp {} ../firmware/ \;

      - name: 上传固件至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipq60xx-firmware
          path: firmware/
